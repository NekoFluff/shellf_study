# Overrides on top of detekt's default rules (buildUponDefaultConfig) — only where the defaults
# contradict this codebase's conventions rather than flag real problems.

naming:
  FunctionNaming:
    # Composables are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Test tags and design tokens are top-level vals named like constants.
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    # Composables take their state and callbacks as parameters by design.
    ignoreAnnotated: ['Composable']

style:
  # Every component that draws in its own window on Android goes through a design-system wrapper,
  # which keeps windows without a text field out of keyboard focus, as Android's AlertDialog does.
  # That guards against the keyboard flashing as one closes when the device's keyboard state is
  # stuck (see designsystem/window/KeyboardFocus.kt). The menus got it in 2ad0303, then a bottom
  # sheet came in without it because nothing enforced it, hence this rule. The wrappers themselves
  # opt out with @file:Suppress("ForbiddenImport").
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'androidx.compose.material3.AlertDialog'
        reason: 'Use AppAlertDialog (no text field) or AppTextInputDialog from designsystem/components, which handle keyboard focus.'
      - value: 'androidx.compose.material3.BasicAlertDialog'
        reason: 'Use AppAlertDialog or AppTextInputDialog from designsystem/components, which handle keyboard focus.'
      - value: 'androidx.compose.material3.ModalBottomSheet'
        reason: 'Use AppModalBottomSheet from designsystem/components, which keeps the sheet out of keyboard focus.'
      - value: 'androidx.compose.material3.DropdownMenu'
        reason: 'Use DropdownMenu from designsystem/components, which keeps the menu out of keyboard focus.'
      - value: 'androidx.compose.material3.ExposedDropdownMenuBox'
        reason: 'Use DropdownMenu from designsystem/components, which keeps the menu out of keyboard focus.'
      - value: 'androidx.compose.ui.window.Dialog'
        reason: 'Use AppAlertDialog, AppTextInputDialog or AppModalBottomSheet from designsystem/components.'
      - value: 'androidx.compose.ui.window.Popup'
        reason: 'Popups take keyboard focus on Android; add a design-system wrapper that keeps them out of it (see DropdownMenu).'
