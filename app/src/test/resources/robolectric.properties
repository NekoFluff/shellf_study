# Robolectric's SDK level for the whole JVM test suite, instead of @Config(sdk = [35]) on 35 classes.
#
# Robolectric 4.15.1 has no shadows for this project's targetSdk (37): running unpinned fails with
# "Unsupported SDK 37" or with shadows missing in ways that look like test bugs. Pinning here means
# the pin lives in one place and a new test cannot forget it — which is exactly what a per-class
# annotation made easy, since a class without it still runs, just against the wrong SDK.
#
# A test that needs different qualifiers still says so on the class; @Config there merges with this.
sdk=35
