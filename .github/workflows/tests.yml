name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create mock google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "shellf-study-mock",
              "storage_bucket": "shellf-study-mock.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.crazyfluff.shellfstudy"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "MOCK_KEY_FOR_CI" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # Compiles commonMain for every target's shared metadata, which is the only check that runs
      # without an Apple host. It is not ceremony: `System.nanoTime()` sat in commonMain for a commit
      # while all 1100+ JVM tests passed, because Android has `System` and Kotlin/Native does not —
      # the metadata compile is what fails on that, and it can run on Linux.
      - name: Compile common metadata (catches platform-only APIs in commonMain)
        run: ./gradlew :shared:compileCommonMainKotlinMetadata

      - name: Run shared (commonTest) unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Run app (Robolectric) unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Fails only on findings newer than each module's detekt-baseline.xml.
      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            shared/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-debug.html

  # The Linux job only compiles commonMain's metadata. This is the one that compiles the iOS target
  # itself and runs commonTest (plus iosTest) on Kotlin/Native, where JVM-only APIs and behaviour
  # differences actually surface.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile the iOS simulator target
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64

      - name: Run shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-test-reports
          path: shared/build/reports/tests
