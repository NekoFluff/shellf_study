# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Caches task outputs so unchanged tasks can be reused across builds/branches.
org.gradle.caching=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Run the Kotlin/Native compiler and linker in their own process for each task, rather than inside
# the long-lived Kotlin daemon (the default in Kotlin 2.x).
#
# Linking the *release* iOS framework is the peak of the whole build: whole-program devirtualization
# over the app plus Compose. Inside the daemon it shared a heap with every JVM compile that ran
# before it, and died with `OutOfMemoryError: Java heap space` in DevirtualizationAnalysis during a
# full `./gradlew build`, even at -Xmx8g, while the same link run on its own passed. In its own
# process it starts with an empty heap, gets the ceiling below, and gives the memory back when done.
# The cost is a few seconds of JVM startup per Native task.
kotlin.native.disableCompilerDaemon=true
# Heap ceiling for that Kotlin/Native process (a ceiling, not a reservation: the compiler only takes
# what it needs). Only one release framework is linked per build (shared/build.gradle.kts builds the
# simulator framework as debug only), so this is never needed twice at once.
kotlin.native.jvmArgs=-Xmx10g
# Heap ceiling for the Kotlin daemon, which still runs the JVM (Android and common) compiles.
kotlin.daemon.jvmargs=-Xmx8g
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# TODO: remove once KSP fully supports AGP 9's "built-in Kotlin" source sets
# (https://github.com/google/ksp/issues/2729). Without this, KSP's generated
# source dirs trip AGP 9's new kotlin.sourceSets DSL guard.
android.disallowKotlinSourceSets=false